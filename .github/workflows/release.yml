name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs: ${{ steps.release.outputs.prs }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch-required-checks:
    name: Dispatch release pull request checks
    needs: release-please
    if: needs['release-please'].outputs.prs_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger required checks for a built-in-token release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ needs['release-please'].outputs.pr }}
          RELEASE_PRS: ${{ needs['release-please'].outputs.prs }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            exit 0
          fi

          head_branch="$(jq -r '.headBranchName // empty' <<< "$RELEASE_PR")"
          pr_number="$(jq -r '.number // empty' <<< "$RELEASE_PR")"
          if [ -z "$head_branch" ]; then
            head_branch="$(jq -r '.[0].headBranchName // empty' <<< "$RELEASE_PRS")"
            pr_number="$(jq -r '.[0].number // empty' <<< "$RELEASE_PRS")"
          fi
          test -n "$head_branch"
          test -n "$pr_number"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$head_branch"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$head_branch" -f pr_number="$pr_number"
